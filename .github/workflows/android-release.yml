name: Android signed release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval val=\$$v
            if [ -z "$val" ]; then
              echo "Missing GitHub secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing is NOT CONFIGURED. Add the four secrets listed in README.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build web
        run: |
          npm ci
          npm run build
          node scripts/qa-unit.mjs
          node scripts/qa-integration.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APK
        working-directory: android
        env:
          RELEASE_SIGNING_REQUIRED: "1"
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and name APK
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$SRC"
          # Basic APK magic / zip local file header
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("android/app/build/outputs/apk/release/app-release.apk")
          data = p.read_bytes()[:4]
          if data[:2] != b"PK":
              print("APK is not a valid zip/apk (missing PK header)", file=sys.stderr)
              sys.exit(1)
          print(f"APK ok: {p.stat().st_size} bytes")
          PY
          mkdir -p artifacts
          cp "$SRC" artifacts/Afterlight.apk
          test -f artifacts/Afterlight.apk
          ls -lh artifacts/Afterlight.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Afterlight
          path: artifacts/Afterlight.apk
          if-no-files-found: error

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch on a branch: mint a version tag from app versionName + run id
            # (run id keeps tags unique without a separate git push that would re-trigger this workflow)
            VERSION="$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -1)"
            TAG="v${VERSION}-r${GITHUB_RUN_ID}"
          fi
          echo "Publishing Afterlight.apk to release tag: ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" artifacts/Afterlight.apk --clobber
            gh release edit "${TAG}" --latest 2>/dev/null || true
          else
            # --target pins the release to this commit; gh creates the lightweight tag (no extra push loop)
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Afterlight ${TAG}" \
              --notes "Signed production APK for Afterlight ${TAG}." \
              --latest \
              artifacts/Afterlight.apk
          fi
          test -f artifacts/Afterlight.apk
          ls -lh artifacts/Afterlight.apk
          echo "Asset URL: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Afterlight.apk"
